<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{{ url_for('static', filename='pico.conditional.green.css') }}">
    <title>Resonator - {% block title %}{% endblock %}</title>
</head>
<body>
    <header class="pico">
        <nav class="container">
            <ul>
                <li><strong><a href="{{ url_for('index') }}" style="font-size: 1.5rem;">Resonator</a></strong></li>
            </ul>
            <ul>
                {% if session.get('user_id') %}
                    <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                    <li><a href="{{ url_for('logout') }}">Logout</a></li>
                {% else %}
                    <li><a href="{{ url_for('login') }}">Login</a></li>
                    <li><a href="{{ url_for('register') }}">Register</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>
    <main class="container">
        {% block main %}{% endblock %}
    </main>
    <footer class="pico">
        <nav class="container">
            <ul>
                <li>&copy; 2026 Satria N. All rights reserved.</li>
            </ul>
        </nav>
    </footer>
</body>
</html>
