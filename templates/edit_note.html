{% extends "base.html" %}
{% block title %}
    {% if note %}Edit Note{% else %}Create Note{% endif %}
{% endblock %}
{% block main %}
<h1>{% if note %}Edit Note: {{ note.title }}{% else %}Create New Note{% endif %}</h1>

<form method="POST" id="note-form">
    <div class="pico">
        <label for="title">
            <strong>Title</strong>
            <input type="text" id="title" name="title" placeholder="Enter note title..."
                   value="{{ note.title if note else '' }}" required>
        </label>
    </div>

    <div class="pico">
        <label for="tags">
            <strong>Tags</strong>
            <input type="text" id="tags" name="tags" placeholder="Separate tags with commas. Example: idea, personal, work."
                   value="{{ tags_value or '' }}">
        </label>
    </div>

    <div>
        <label for="markdown-editor">
            <strong>Content</strong>
        </label>
        <textarea id="markdown-editor" name="content">{{ note.content if note else '' }}</textarea>
    </div>

    <div class="pico">
        <fieldset role="group">
            <button type="submit" role="button">{% if note %}Update Note{% else %}Create Note{% endif %}</button>
            <a href="{{ url_for('dashboard') }}" role="button" class="outline">Cancel</a>
        </fieldset>
    </div>
</form>

<link rel="stylesheet" href="{{ url_for('static', filename='easymde.min.css') }}">
<script src="{{ url_for('static', filename='easymde.min.js') }}"></script>

<script>
    const easyMDE = new EasyMDE({
        element: document.getElementById("markdown-editor"),
        spellChecker: false,
        toolbar: [
            "bold", "italic", "strikethrough", "heading", "|",
            "quote", "unordered-list", "ordered-list", "|",
            "link", "image", "table", "|",
            "preview", "side-by-side", "fullscreen", "|",
            "guide", "undo", "redo"
        ],
        lineNumbers: false,
        lineWrapping: true,
        previewClass: "editor-preview"
    });

    document.getElementById("note-form").addEventListener("submit", function (event) {
        if (!easyMDE.value().trim()) {
            event.preventDefault();
            easyMDE.codemirror.focus();
            alert("Content is required.");
        }
    });
</script>

<style>
    .EasyMDEContainer .editor-preview {
        background-color: #f9f9f9;
    }
    .CodeMirror {
        border: 1px solid #ddd;
        border-radius: 0.25rem;
    }
    .editor-toolbar {
        background-color: rgb(245 245 245 / 0.06);
        border: 1px solid #ddd;
        border-radius: 0.25rem 0.25rem 0 0;
    }
</style>
{% endblock %}
