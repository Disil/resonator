{% extends "base.html" %}
{% block title %}
    {% if note %}Edit Catatan{% else %}Create Catatan{% endif %}
{% endblock %}
{% block main %}
<h1>{% if note %}Edit Catatan: {{ note.title }}{% else %}Buat Catatan Baru{% endif %}</h1>

<form method="POST" id="note-form">
    <div class="pico">
        <label for="title">
            <strong>Judul</strong>
            <input type="text" id="title" name="title" placeholder="Masukkan judul catatan..."
                   value="{{ note.title if note else '' }}" required>
        </label>
    </div>

    <div class="pico">
        <label for="tags">
            <strong>Tag</strong>
            <input type="text" id="tags" name="tags" placeholder="contoh: kuliah, flask, ide"
                   value="{{ tags_value or '' }}">
        </label>
        <small>Pisahkan dengan koma. Tag akan disimpan tanpa tanda <code>#</code>.</small>
    </div>

    <div>
        <label for="markdown-editor">
            <strong>Isi Catatan</strong>
        </label>
        <textarea id="markdown-editor" name="content">{{ note.content if note else '' }}</textarea>
    </div>

    <div class="pico">
        <fieldset role="group">
            <button type="submit" role="button">{% if note %}Update Catatan{% else %}Buat Catatan{% endif %}</button>
            <a href="{{ url_for('dashboard') }}" role="button" class="outline">Batal</a>
        </fieldset>
    </div>
</form>

<!-- EasyMDE CSS -->
<link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">

<!-- EasyMDE JS -->
<script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>

<script>
    const easyMDE = new EasyMDE({
        element: document.getElementById("markdown-editor"),
        spellChecker: false,
        autoDownloadFontAwesome: true,
        toolbar: [
            "bold", "italic", "strikethrough", "heading", "|",
            "quote", "unordered-list", "ordered-list", "|",
            "link", "image", "table", "|",
            "preview", "side-by-side", "fullscreen", "|",
            "guide", "undo", "redo"
        ],
        lineNumbers: true,
        lineWrapping: true,
        previewClass: "editor-preview"
    });

    document.getElementById("note-form").addEventListener("submit", function (event) {
        if (!easyMDE.value().trim()) {
            event.preventDefault();
            easyMDE.codemirror.focus();
            alert("Konten catatan wajib diisi.");
        }
    });
</script>

<style>
    .EasyMDEContainer .editor-preview {
        background-color: #f9f9f9;
    }
    .CodeMirror {
        border: 1px solid #ddd;
        border-radius: 0.25rem;
    }
    .editor-toolbar {
        background-color: rgb(245 245 245 / 0.06);
        border: 1px solid #ddd;
        border-radius: 0.25rem 0.25rem 0 0;
    }
</style>
{% endblock %}
